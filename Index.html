<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad-Free Stream Test</title>
  <!-- Referer Hide කිරීමෙන් Ads සහ Tracking වලක්වයි -->
  <meta name="referrer" content="no-referrer" />
  
  <!-- Plyr CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .player-container {
      width: 100%;
      max-width: 850px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Ad-Free HLS Stream Test Player</h1>

  <div class="player-container">
    <video id="player" controls playsinline crossorigin="anonymous"></video>
  </div>

  <!-- HLS.js සහ Plyr JS CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('player');
      
      // පරීක්ෂා කිරීමට Direct HLS Video (.m3u8) Link එක
      const streamUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen']
          });
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        new Plyr(video);
      }
    });
  </script>
</body>
</html>
